<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kazan Winter Loop</title>
  <style>
    html, body {
      margin: 0;
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: #9ec9e8;
    }
    #stage {
      position: relative;
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: #9ec9e8;
    }
    #world {
      position: absolute;
      inset: 0;
      transform-origin: 50% 48%;
      will-change: transform;
    }
    #base {
      position: absolute;
      inset: 0;
      width: 1024px;
      height: 1024px;
      display: block;
    }
    #fx {
      position: absolute;
      inset: 0;
      width: 1024px;
      height: 1024px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="world">
      <img id="base" src="../../public/cities/kazan.png" alt="Kazan winter miniature" />
      <canvas id="fx" width="1024" height="1024"></canvas>
    </div>
  </div>
  <script>
    const SIZE = 1024
    const LOOP_MS = 7000
    const canvas = document.getElementById('fx')
    const ctx = canvas.getContext('2d')
    const world = document.getElementById('world')
    const base = document.getElementById('base')

    const clouds = [
      { x: 180, y: 70, rx: 120, ry: 42, speed: 18, alpha: 0.55 },
      { x: 520, y: 55, rx: 150, ry: 48, speed: 12, alpha: 0.45 },
      { x: 860, y: 80, rx: 110, ry: 38, speed: 15, alpha: 0.5 },
      { x: 350, y: 40, rx: 90, ry: 30, speed: 10, alpha: 0.35 }
    ]

    // Deterministic flakes: position is a pure function of loop time
    const flakes = Array.from({ length: 160 }, (_, i) => {
      const seed = (i + 1) * 9973
      const rand = (n) => {
        const x = Math.sin(seed * 12.9898 + n * 78.233) * 43758.5453
        return x - Math.floor(x)
      }
      return {
        x0: rand(1) * SIZE,
        y0: rand(2) * SIZE,
        r: 1.2 + rand(3) * 2.8,
        fallCycle: 2.8 + rand(4) * 3.6,
        drift: (-18 + rand(5) * 36),
        wobbleAmp: 6 + rand(6) * 14,
        wobbleSpeed: 0.7 + rand(7) * 1.8,
        alpha: 0.35 + rand(8) * 0.55
      }
    })

    function drawCloud(c, tLoop) {
      const period = SIZE + c.rx * 4
      const travel = ((c.speed * tLoop) / 1000) % period
      const x = ((c.x + travel) % period + period) % period - c.rx * 2
      ctx.save()
      ctx.globalAlpha = c.alpha
      const g = ctx.createRadialGradient(x, c.y, 4, x, c.y, c.rx)
      g.addColorStop(0, 'rgba(255,255,255,0.95)')
      g.addColorStop(1, 'rgba(255,255,255,0)')
      ctx.fillStyle = g
      ctx.beginPath()
      ctx.ellipse(x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2)
      ctx.fill()
      ctx.beginPath()
      ctx.ellipse(x - c.rx * 0.45, c.y + 6, c.rx * 0.55, c.ry * 0.75, 0, 0, Math.PI * 2)
      ctx.fill()
      ctx.beginPath()
      ctx.ellipse(x + c.rx * 0.4, c.y + 4, c.rx * 0.5, c.ry * 0.7, 0, 0, Math.PI * 2)
      ctx.fill()
      ctx.restore()
    }

    function drawFrame(t) {
      const tLoop = ((t % LOOP_MS) + LOOP_MS) % LOOP_MS
      const phase = tLoop / LOOP_MS
      const angle = phase * Math.PI * 2
      const sec = tLoop / 1000

      const scale = 1.02 + 0.028 * Math.sin(angle)
      const panX = 6 * Math.sin(angle)
      const panY = 4 * Math.cos(angle) + 2 * Math.sin(angle * 2)
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`

      ctx.clearRect(0, 0, SIZE, SIZE)

      for (const c of clouds) drawCloud(c, tLoop)

      for (const f of flakes) {
        const y = ((f.y0 + (sec / f.fallCycle) * (SIZE + 20)) % (SIZE + 20)) - 10
        const x = (f.x0 + sec * f.drift + Math.sin(sec * f.wobbleSpeed + f.x0) * f.wobbleAmp + SIZE * 4) % SIZE
        ctx.beginPath()
        ctx.fillStyle = `rgba(255,255,255,${f.alpha})`
        ctx.arc(x, y, f.r, 0, Math.PI * 2)
        ctx.fill()
      }
    }

    window.__kazanRender = function (tMs) {
      drawFrame(tMs)
    }

    window.__kazanReady = false
    base.onload = () => {
      window.__kazanReady = true
      drawFrame(0)
    }
    if (base.complete && base.naturalWidth) {
      window.__kazanReady = true
      drawFrame(0)
    }

    let start = performance.now()
    function preview(now) {
      if (!window.__CAPTURE__) {
        drawFrame(now - start)
        requestAnimationFrame(preview)
      }
    }
    requestAnimationFrame(preview)
  </script>
</body>
</html>
