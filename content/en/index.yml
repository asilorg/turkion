    - icon: i-streamline-plump-color:book-1-flat
      title: "The Turkic World: Your Digital Gateway"
      description: Discover shared roots, languages, and a vibrant, diverse culture.
    - icon: i-streamline-color:islam-flat
      title: Related languages, diverse peoples
      description: Explore a language family and the distinct histories of its speakers across Eurasia.
    - icon: i-streamline-plump-color:world-flat
      title: Unlock the New World
      description: From Siberian heartlands to Mediterranean shores, discover the peoples and cultures that shape the Turkic world. Your comprehensive guide to a rich, interconnected heritage awaits.
