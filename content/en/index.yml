title: Digital Encyclopedia of the Turkic World
description: Much of history is told through great states and familiar names. Less often remembered are the smaller peoples — those whose languages still live in mountain valleys, steppe villages, and distant towns. Their historical places lie scattered across wide lands, from quiet riverbanks to highland passes and forgotten roads. This encyclopedia gathers what can still be known of their histories and ways of life.
