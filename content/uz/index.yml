  title: Turk Dunyosi Ensiklopediyasi
  description: "Katta tarix ko‘pincha yirik davlatlar va tanish nomlar orqali aytiladi. Kamroq esga olinadiganlari — kichik xalqlar: tillari tog‘ vodiylarida, dasht qishloqlarida va uzoq shaharlarda saqlanib kelayotgan jamoalar. Ularning tarixiy joylari keng yerlarga sochilgan — sokin daryo sohillarida, tog‘ dovonlarida va unutilgan yo‘llar bo‘yida. Bu yerda ularning tarixi va turmush tarzi haqida hali bilish mumkin bo‘lgan narsalar jamlangan."
