      title: "Turk Olami: Sizning Raqamli Darvozangiz."
      description: Umumiy ildizlar, tillar va jonli, rang-barang madaniyatni kashf eting.
    - icon: i-streamline-color:islam-flat
      title: Qardosh tillar, xilma-xil xalqlar
      description: Yevroosiyodagi bir til oilasi va uning sohiblariga xos turli tarixlarni o‘rganing.
    - icon: i-streamline-plump-color:world-flat
      title: Yangi Dunyoni Oching.
      description: Sibir chuqurlaridan O'rta dengiz sohillarigacha — turk dunyosini shakllantirgan xalqlar va madaniyatlarni kashf eting. Sizni boy va o'zaro bog'langan merosga olib boradigan har tomonlama qo'llanma kuting.
