title: Loyiha va tahrir ishlari haqida
description: Turkion — rivojlanayotgan ko‘p tilli ma’lumotnoma. Qoralama maqolalar mutaxassis tekshiruvidan o‘tmagan. Havolalar foydalanilgan dalillarni ko‘rsatadi, manba tashkilotining loyihani ma’qullashini anglatmaydi. Sharhdan boshlang, mahalliy an’analarni qiyoslang va tuzatish tayyorlashda mualliflar qo‘llanmasidan foydalaning. Ilmiy tahrir hay’ati yoki taklif etilgan olimlar dasturi borligi da’vo qilinmaydi.
