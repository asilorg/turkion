title: Miniatyuralar
description: Temuriylar, Usmonlilar va Boburiylar kitob miniatyuralari galereyasi. Izohlar avvalgi katalogdan saqlangan; tasdiqlangan manbalar va aniqlanmagan atributsiya har bir tasvir yonida ko‘rsatiladi.
navigation: true
hero:
  title: Turkiy miniatyura xazinalari
  description: Temuriylar, Usmonlilar va Boburiylar to‘plamlaridagi kitob rasmlari. Tasvirni kattaroq ko‘rish uchun oching; manba va litsenziya tasdiqlanganda alohida ko‘rsatiladi.
