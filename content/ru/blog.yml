title: О проекте и редакционной работе
description: Turkion — развивающийся многоязычный справочник. Статьи с пометкой «черновик» не прошли проверку специалистами. Ссылки указывают на использованные сведения, а не на одобрение проекта источниками. Начните с обзора, сопоставляйте местные практики и используйте руководство для авторов при подготовке исправлений. Наличие научной редколлегии или программы приглашённых учёных не заявляется.
