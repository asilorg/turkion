title: Хронология тюркских народов
description: Выборочная хронология от ранней степной предыстории до XXI века с указанием исторической неопределённости.
timeline:
- title: Хронология тюркских народов
  date: Введение
  markdown: Эта выборочная хронология охватывает ранние степные предпосылки, документированные тюркские каганаты с 552 года, средневековые переселения и государства, а также события Нового и Новейшего времени до 2016 года. Она не ограничена 500–1300 годами. Название древнего объединения само по себе не устанавливает его язык, а средневековое государство нельзя отождествлять с современной нацией. Хунну включены как спорная предыстория, а не как бесспорно тюркское государство. Даты и унаследованные интерпретации остаются редакционным черновиком и требуют проверки специалистом.
  id: prologue
- title: III век до нашей эры
  date: III в. до н. э.
  markdown: |-
    ### 209 год до н. э.: Модэ и хунну

    Модэ (Маодунь) стал шаньюем в 209 году до н. э. и укрепил объединение хунну. Его этноязыковой состав остаётся спорным. Савельев и Чон (2020) обсуждают свидетельства, допускающие участие тюркоязычных групп, и ограничения при сопоставлении населения, языков и позднейших гуннов. Поэтому объединение нельзя представлять как однородную тюркскую нацию или первое надёжно засвидетельствованное тюркское государство. Современная военная памятная дата, отнесённая к 209 году до н. э., не доказывает непрерывной преемственности учреждения.

    [Encyclopaedia Iranica: Xiongnu](https://www.iranicaonline.org/articles/xiongnu/); [Савельев и Чон, 2020](https://doi.org/10.1017/ehs.2020.18).
  id: xiongnu
- title: IV век
  date: IV в.
  markdown: |-
    ## Переселения поздней античности

    Во второй половине IV века гуннское продвижение в Причерноморье стало одним из факторов переселений, изменивших отношения степных обществ и Римской империи. Набеги гуннов через Кавказ в 395 году показывают масштаб этих связей.

    Гуннское объединение включало разные группы. Его язык и связь с хунну нельзя считать установленными только по сходству названий. Это контекст позднейшей тюркской истории, а не доказанная история единого тюркского народа. [Савельев и Чон (2020)](https://doi.org/10.1017/ehs.2020.18) сопоставляют археологические, языковые и генетические аргументы и подчёркивают различие между ними.
  id: century-4
- title: V век
  date: V в.
  markdown: |-
    ## Сабиры и ранние булгарские объединения

    В V веке источники упоминают сабиров и группы, позднее связанные с булгарами, в пространстве между степями Евразии, Северным Кавказом и Причерноморьем. Названия перемещались вместе с союзами и не всегда обозначали неизменные этнические группы.

    Прежние записи «сабиры в Сибири в 461 году» и «праболгары между Каспием и Дунаем в 480 году» слишком точно фиксировали спорные реконструкции. Здесь они заменены общим контекстом: ранние огурские объединения участвовали в миграциях и перегруппировках поздней античности. Их отношения с позднейшими хазарами рассматриваются в [Encyclopaedia Iranica: Khazars](https://www.iranicaonline.org/articles/khazars/).
  id: century-5
- title: VI век
  date: VI в.
  markdown: |-
    ## Возникновение Тюркского каганата

    | Год | Событие |
    | --- | --- |
    | 552 | Бумын разгромил жужаней и основал Тюркский каганат. |
    | 553–572 | Правление Мукан-кагана; расширение власти на востоке. |
    | 568 | Посольство, связанное с Истеми и возглавленное согдийцем Маниахом, прибыло в Византию. |
    | 581 | Смерть Таспара; начало династической борьбы. |
    | 588–589 | Конфликт тюркских сил с Сасанидским Ираном. |

    Ашина создали власть, соединявшую степные союзы, военные походы и отношения с соседними дворами. Западное крыло было связано с Истеми и торговыми путями Центральной Азии. Согдийские посредники участвовали в дипломатии и обмене шёлком. Каганат нельзя понимать как современное национальное государство: его подданные говорили на разных языках.

    Орхонские надписи VIII века вспоминают Бумына и Истеми как основателей порядка. Они важны для изучения политической памяти, но являются более поздними текстами, а не непосредственной записью событий 552 года. [Об огузских объединениях и раннем каганате](https://www.iranicaonline.org/articles/gozz/).
  id: century-6
- title: VII век
  date: VII в.
  markdown: |-
    ## Разделение каганата и отношения с Тан

    | Год | Событие |
    | --- | --- |
    | Около 603 | Закрепилось разделение на Восточный и Западный каганаты. |
    | 626 | Восточные тюрки подошли к столице Тан; последовали переговоры у реки Вэй. |
    | 630 | Тан разгромила Восточный каганат и захватила его правителя. |
    | 657 | Поход Тан сломил власть западного кагана Ашина Хэлу. |
    | 682 | Возник Второй Тюркский каганат во главе с Ильтеришем. |

    Дипломатия, брачные союзы, торговля, внутренние конфликты и военные действия определяли отношения тюркских правителей с китайскими династиями. Подчинение кагана не означало исчезновения всех подвластных ему сообществ. Часть элит служила Тан, другие участвовали в новых союзах.

    В западных степях формировались хазарские и булгарские политические объединения. Приписывание более ранних событий «хазарам» нередко отражает позднейшее название западнотюркских сил; это различие разобрано в [статье о хазарах](https://www.iranicaonline.org/articles/khazars/).
  id: century-7
- title: VIII век
  date: VIII в.
  markdown: |-
    ## Орхонские памятники, уйгуры и Талас

    | Год | Событие |
    | --- | --- |
    | 716 | Бильге-каган пришёл к власти после гибели Капаган-кагана. |
    | 732 | Установлен памятник Кюль-тегину. |
    | 735 | Установлен памятник Бильге-кагану. |
    | 744 | Уйгуры утвердили новый каганат в Монголии. |
    | 751 | У Таласа войска Тан столкнулись с Аббасидами и их союзниками; карлуки сыграли существенную роль. |
    | 762–763 | При уйгурском дворе усилилось покровительство манихейству. |

    Орхонские тексты представляют правительственный взгляд на власть, верность и отношения с соседями. Их язык — ключевой источник ранней тюркской письменности. Уйгурский каганат продолжил степную дипломатию, взаимодействовал с Тан и согдийскими торговыми сетями.

    Талас не был одномоментным «обращением Центральной Азии в ислам». Религиозные изменения, городская жизнь и распространение технологий развивались значительно дольше. [Статья о Таласской битве](/ru/docs/wars/battle-of-talas).
  id: century-8
- title: IX век
  date: IX в.
  markdown: |-
    ## После падения Уйгурского каганата

    | Год | Событие |
    | --- | --- |
    | 840 | Кыргызское нападение привело к падению Уйгурского каганата в Монголии. |
    | IX век | Уйгурские группы переселялись в Ганьсу и оазисы Восточного Туркестана. |
    | IX век | В Центральной Азии усиливались карлукские, огузские и другие объединения. |

    Переселения сочетались с сохранением письменности, религиозных традиций и торговых связей. Оазисные уйгурские общества развивали формы оседлой жизни и многоязычного книжного производства. Манихейские и буддийские памятники нельзя свести к одной религиозной принадлежности всех уйгуров.

    Западнее взаимодействовали хазары, огузские группы и соседи Волго-Каспийского региона. Политические границы и языковые ареалы не совпадали. Историю региона следует читать вместе с историей иранских и других нетюркских сообществ. [Центральная Азия до монголов](https://www.iranicaonline.org/articles/central-asia-iv/).
  id: century-9
- title: X век
  date: X в.
  markdown: |-
    ## Исламизация и новые династии

    | Год | Событие |
    | --- | --- |
    | 922 | Посольство Аббасидов прибыло в Волжскую Булгарию; путешествие описал Ибн Фадлан. |
    | X век | Караханидские правители приняли ислам; источники по-разному представляют этапы этого процесса. |
    | 965 | Поход Святослава нанёс тяжёлый удар Хазарскому каганату. |
    | 999 | Караханиды заняли Бухару, завершив власть Саманидов в Мавераннахре. |

    Обращение правителя не тождественно одновременному обращению всех жителей. Исламские институты, торговля и новые формы покровительства развивались в обществах с разными языками и хозяйственным укладом. Газневиды представляли ещё одну династическую среду, где тюркское военное происхождение сочеталось с персидской придворной культурой.

    Караханидская власть сохраняла собственные титулы и опиралась на исламскую легитимацию. [Encyclopaedia Iranica: Ilak-Khanids](https://www.iranicaonline.org/articles/ilak-khanids/).
  id: century-10
- title: XI век
  date: XI в.
  markdown: |-
    ## Сельджуки, литература и Анатолия

    | Год | Событие |
    | --- | --- |
    | 1040 | Победа сельджуков при Данданакане укрепила их власть в Хорасане. |
    | 1055 | Тогрул-бек вступил в Багдад. |
    | 1069–1070 | Юсуф Баласагуни завершил «Кутадгу билиг». |
    | 1071 | Альп-Арслан победил византийскую армию при Манцикерте. |
    | 1070-е | Махмуд Кашгари составил «Диван лугат ат-турк». |

    Огузские переселения и сельджукское государственное строительство связывали Центральную Азию, Иран и Анатолию. Персидская администрация, арабская учёность и тюркские военные и литературные традиции сосуществовали. Манцикерт повлиял на политическую ситуацию, но освоение Анатолии и языковые изменения продолжались столетиями.

    Печенежские и кыпчакские объединения играли важную роль в Причерноморье. Их история не сводится к истории сельджукского двора. [Сельджукская литература](https://www.iranicaonline.org/articles/saljuqs-v/); [Византийско-сельджукские войны](/ru/docs/wars/seljuk-byzantine-wars).
  id: century-11
- title: XII век
  date: XII в.
  markdown: |-
    ## Каракитаи, Хорезм и Румский султанат

    | Год | Событие |
    | --- | --- |
    | 1141 | Каракитаи победили войско султана Санджара при Катване. |
    | 1153 | Огузское восстание и пленение Санджара ослабили восточную сельджукскую власть. |
    | 1157 | Смерть Санджара стала важным рубежом распада государства Великих Сельджуков. |
    | 1176 | Византийская армия потерпела поражение при Мириокефале. |

    В Мавераннахре караханидские правители зависели от каракитайской верховной власти. Хорезмшахи расширяли самостоятельность и территорию. В Анатолии Румский султанат развивал города, торговые пути и придворные институты; его наибольший подъём приходится на конец XII — начало XIII века.

    Это были взаимосвязанные, но разные политические процессы. Подданство, язык и религия не совпадали в пределах каждого государства. [Санджар](https://www.iranicaonline.org/articles/sanjar/); [Сельджуки Рума](https://www.iranicaonline.org/articles/saljuqs-iii/).
  id: century-12
- title: XIII век
  date: XIII в.
  markdown: |-
    ## Монгольские завоевания и новые политические пространства

    | Год | Событие |
    | --- | --- |
    | 1206 | Темучин провозглашён Чингисханом. |
    | 1219–1221 | Монгольские армии разгромили основные владения Хорезмшахов. |
    | 1236–1242 | Походы на Волжскую Булгарию, Русь и Центральную Европу. |
    | 1243 | После Кёсе-дага Румский султанат оказался в зависимости от монголов. |
    | 1256 | Началось формирование государства Хулагуидов в Иране. |
    | 1260 | Мамлюки остановили монгольское войско при Айн-Джалуте. |

    Монгольское завоевание было разрушительным, но его последствия различались по регионам. Джучидские и чагатайские владения включали многочисленные тюркоязычные сообщества. Позднейшее распространение тюркских языков в этих государствах не делает первоначальные монгольские армии единым тюркским народом.

    После ослабления сельджукской власти в Анатолии росли бейлики, среди которых в конце века выделилось османское владение. [Монгольские завоевания](/ru/docs/wars/mongol-conquests); [Сельджуки Рума](https://www.iranicaonline.org/articles/saljuqs-iii/).
  id: century-13
- title: XIV век
  date: XIV в.
  markdown: |-
    ## Османы, Золотая Орда и Тимур

    | Год | Событие |
    | --- | --- |
    | 1320 | Началось правление Туглакидов в Дели. |
    | 1354 | Османы закрепились в Галлиполи. |
    | 1370 | Тимур утвердил власть в Мавераннахре. |
    | 1382 | Тохтамыш захватил и разорил Москву. |
    | 1389 | Косовская битва стала важным событием османской экспансии на Балканах. |
    | 1398 | Тимур вторгся в Северную Индию и захватил Дели. |

    Разные постмонгольские династии соперничали за города, торговые пути и легитимность. Тимур опирался на чингизидские политические представления, но не был чингизидом. Его завоевания сопровождались насилием и перемещением ремесленников. В Китае складывались отдельные мусульманские тюркоязычные сообщества, включая саларов; точную модель их происхождения нельзя выводить из одной даты переселения. [Тимур](/ru/docs/wars/timurs-military-campaigns); [Туркменский язык и салары](https://www.iranicaonline.org/articles/turkmens-language/).
  id: century-14
- title: XV век
  date: XV в.
  markdown: |-
    ## Династии и ханства XV века

    | Год | Событие |
    | --- | --- |
    | 1402 | Тимур победил Баязида I при Анкаре. |
    | 1405 | Смерть Тимура; борьба преемников и возвышение Шахруха. |
    | XV век | Формировались Казанское, Крымское и Астраханское ханства. |
    | 1453 | Мехмед II захватил Константинополь. |
    | 1460-е | Началось формирование Казахского ханства. |
    | Конец XV века | Двор Хусейна Байкары в Герате стал важным центром литературы и искусства. |

    Кара-Коюнлу и Ак-Коюнлу соперничали за власть в Иране и соседних областях. Тимуридские центры Самарканда и Герата развивали разные научные и художественные сети. Их наследие включало персидскую и тюркскую литературу; язык династии не определял весь культурный состав государства. [Тимуридская историография](https://www.iranicaonline.org/articles/historiography-v/).
  id: century-15
- title: XVI век
  date: XVI в.
  markdown: |-
    ## Империи XVI века

    | Год | Событие |
    | --- | --- |
    | 1500–1501 | Мухаммад Шейбани овладел ключевыми центрами Мавераннахра. |
    | 1501 | Исмаил I утвердил Сефевидскую династию в Иране. |
    | 1510 | Шейбани погиб в сражении с Сефевидами у Мерва. |
    | 1514 | Чалдыранская битва между османами и Сефевидами. |
    | 1516–1517 | Османы завоевали Сирию и Египет; Риданийская битва произошла в 1517 году. |
    | 1526 | Бабур победил при Панипате; начало могольской власти в Северной Индии. |
    | 1552, 1556 | Москва завоевала Казанское и Астраханское ханства. |
    | 1571 | Крымское войско сожгло Москву. |
    | Конец XVI века | Русское продвижение в Западной Сибири разрушило власть Сибирского ханства. |

    Османская экспансия охватывала Средиземноморье, а османо-сефевидское соперничество меняло границы Кавказа и Месопотамии. Различие династий и религиозных политик важнее представления обо всех этих государствах как о едином блоке. [Панипат](/ru/docs/wars/foundation-of-the-mughal-empire); [Казанские войны](/ru/docs/wars/russo-kazan-wars).
  id: century-16
- title: XVII век
  date: XVII в.
  markdown: |-
    ## Фронтиры и имперское соперничество

    | Год | Событие |
    | --- | --- |
    | 1606 | Житваторокский мир урегулировал очередную османо-габсбургскую войну. |
    | 1628–1658 | Правление Шах-Джахана в Могольской империи. |
    | 1630-е | Русское продвижение в бассейн Лены и сопротивление местных сообществ. |
    | 1658–1707 | Правление Аурангзеба. |
    | 1680 | Джунгарское вмешательство изменило власть в Восточном Туркестане. |
    | 1683 | Неудача османской осады Вены. |
    | 1699 | Карловицкий мир закрепил значительные османские территориальные потери. |

    Енисейские кыргызы, саха и другие сибирские сообщества переживали военное давление, обложение данью и изменение торговых связей. Калмыцкие переселения на запад и джунгарская экспансия воздействовали на казахские и соседние общества. «Присоединение» региона следует понимать как длительный процесс, включавший сопротивление и переговоры. [Османо-габсбургские войны](/ru/docs/wars/ottoman-habsburg-wars).
  id: century-17
- title: XVIII век
  date: XVIII в.
  markdown: |-
    ## XVIII век: новые зависимости и династии

    | Год | Событие |
    | --- | --- |
    | 1709 | Традиционная дата основания Кокандского ханства. |
    | 1718–1730 | Османская эпоха тюльпанов. |
    | 1731 | Абулхаир принял российское подданство; это не означало немедленного подчинения всех казахов. |
    | 1736–1747 | Правление Надир-шаха в Иране. |
    | 1755–1759 | Цинские завоевания Джунгарии и Таримского бассейна. |
    | 1773–1775 | Восстание Пугачёва с участием разных народов Российской империи. |
    | 1783 | Российская аннексия Крыма. |
    | 1798–1799 | Египетский поход Бонапарта. |

    Джунгаро-казахские войны, усиление Цин и российское продвижение меняли степные отношения. В Иране возвысились Афшариды, позднее Каджары; Бухара перешла под власть мангытской династии. Хронология не описывает эти процессы как естественное или бесконфликтное объединение территорий. [Надир-шах](https://www.iranicaonline.org/articles/nader-shah/).
  id: century-18
- title: XIX век
  date: XIX в.
  markdown: |-
    ## XIX век: завоевания, реформы и новые границы

    | Год | Событие |
    | --- | --- |
    | 1813, 1828 | Гюлистанский и Туркманчайский договоры изменили российско-иранскую границу. |
    | 1839 | Гюльханейский хатт-и шериф открыл эпоху Танзимата. |
    | 1865 | Российские войска взяли Ташкент. |
    | 1868 | Бухара оказалась в зависимости от Российской империи. |
    | 1873 | Российский поход против Хивы. |
    | 1876 | Кокандское ханство аннексировано; принята первая османская конституция. |
    | 1877–1878 | Цин восстановила контроль над большей частью владений Якуб-бека. |
    | 1878 | Берлинский договор изменил положение балканских государств. |
    | 1881–1884 | Российское завоевание туркменских территорий, включая Геок-Тепе и Мерв. |

    События сопровождались насилием, миграцией и перестройкой управления. Школьные, печатные и религиозные реформы связывали тюркоязычные сообщества с общеимперскими процессами. В Южной Азии британцы упразднили могольскую монархию в 1858 году; в Северной Африке расширялась европейская колониальная власть. Сравнение регионов не должно смешивать разные договоры и формы зависимости.
  id: century-19
- title: XX век
  date: XX в.
  markdown: |-
    ## XX век: войны, республики и независимость

    | Год | Событие |
    | --- | --- |
    | Начало XX века | Развитие джадидского образования и печати; движение возникло ранее 1905 года. |
    | 1915–1916 | Галлипольская кампания Первой мировой войны. |
    | 1916 | Восстание в Центральной Азии и массовое насилие при его подавлении. |
    | 1917–1920 | Автономистские проекты, революция и гражданская война; движение Алаш и Кокандская автономия. |
    | 1918 | Создана Азербайджанская Демократическая Республика; подписано Мудросское перемирие. |
    | 1919–1923 | Турецкая война за независимость и создание республики. |
    | 1921–1944 | Тувинская Народная Республика. |
    | 1933–1934, 1944–1949 | Два разных республиканских проекта в Восточном Туркестане. |
    | 1974 | Турецкая военная интервенция на Кипре. |
    | 1991 | Распад СССР и независимость пяти тюркоязычных союзных республик. |
    | 1992 | Азербайджан, Казахстан, Кыргызстан, Туркменистан и Узбекистан вступили в ООН; первый саммит тюркоязычных государств. |

    Советские реформы письменности, коллективизация, голод, репрессии и перемещения населения глубоко изменили жизнь сообществ. Ни образование республик, ни межгосударственное сотрудничество не охватывают всех тюркских народов. [Турецкая война за независимость](/ru/docs/wars/turkish-war-of-independence); [история саммитов](https://turkicstates.org/en/presidental-summits).
  id: century-20
- title: XXI век
  date: XXI в.
  markdown: |-
    ## XXI век: политика и сотрудничество

    | Год | Событие |
    | --- | --- |
    | 2005 | Тюльпановая революция в Кыргызстане; убийства протестующих в Андижане. |
    | 2006 | Ввод нефтепровода Баку — Тбилиси — Джейхан. |
    | 2008 | Создана Парламентская ассамблея тюркоязычных государств. |
    | 2009 | Подписано Нахичеванское соглашение о создании Тюркского совета. |
    | 2013 | Протесты вокруг парка Гези в Турции. |
    | 2016 | Попытка военного переворота в Турции. |

    Тюркский совет получил название «Организация тюркских государств» позднее, в 2021 году; применять это название к учреждению 2009 года без пояснения неточно. Хронология заканчивает основную подборку 2016 годом и не является лентой текущих событий. [История организации](https://www.turkicstates.org/en/organization-of-turkic-states).
  id: century-21
- title: Историографические дискуссии
  date: Интерпретации
  markdown: |-
    ## Как читать исторические реконструкции

    Язык, политическое подданство, археологическая культура и генетическое происхождение — разные категории. Обнаруженное сходство геномов не устанавливает язык человека; сходная вещь в погребении не доказывает единую этничность. Для реконструкции нужны сопоставимые письменные, археологические и языковые данные.

    Особенно осторожно следует обращаться с хунну, гуннами, аварами и другими ранними объединениями. Связи между ними обсуждаются в науке, но не позволяют строить непрерывную национальную родословную от одной империи к другой. [Савельев и Чон (2020)](https://doi.org/10.1017/ehs.2020.18) рассматривают такие сопоставления как междисциплинарную задачу.

    Повествования о «распространении тюрков» также нуждаются в разделении процессов: движение людей, смена элит, усвоение языка и принятие религии могли происходить в разное время. Проценты генетического вклада зависят от выборки и модели; их нельзя превращать в меру культурной принадлежности. Государственные хроники и позднейшие национальные истории следует читать с учётом целей авторов.
  id: historiography
- title: Источники
  date: Литература
  markdown: |-
    ## Источники и пределы обзора

    - [Савельев и Чон (2020): ранние кочевники восточной степи](https://doi.org/10.1017/ehs.2020.18).
    - [Encyclopaedia Iranica: Xiongnu](https://www.iranicaonline.org/articles/xiongnu/).
    - [Encyclopaedia Iranica: Khazars](https://www.iranicaonline.org/articles/khazars/).
    - [Encyclopaedia Iranica: Ilak-Khanids](https://www.iranicaonline.org/articles/ilak-khanids/).
    - [Encyclopaedia Iranica: Saljuqs of Rum](https://www.iranicaonline.org/articles/saljuqs-iii/).
    - [Encyclopaedia Iranica: Timurid historiography](https://www.iranicaonline.org/articles/historiography-v/).
    - [Encyclopaedia Iranica: Nader Shah](https://www.iranicaonline.org/articles/nader-shah/).
    - [Организация тюркских государств: история саммитов](https://turkicstates.org/en/presidental-summits).

    Это выборочная редакционная хронология, а не полная летопись каждого народа. Источники поддерживают соответствующие темы и примеры; список не означает проверки каждого унаследованного утверждения специалистом. Датировки ранних событий и интерпретации причин требуют отдельного критического чтения.
  id: references
